name: Sync Hardcover Reading Data

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync reading data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest Hardcover data
        env:
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
        run: pnpm run sync:hardcover

      - name: Format generated data
        run: pnpm dlx prettier@3.9.6 --write src/data/hardcoverBooks.ts

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "fix(reading): sync hardcover reading data"
          title: "fix(reading): sync hardcover reading data"
          body: |
            Automated daily sync of currently-reading / recently-finished
            books from [Hardcover](https://hardcover.app/@schie).

            Generated by `.github/workflows/hardcover-sync.yml` via
            `pnpm run sync:hardcover`. Merging this cuts a patch release
            (`fix(reading): ...`) and deploys the updated site.
          branch: hardcover-sync
          base: master
          delete-branch: true
          add-paths: src/data/hardcoverBooks.ts
